<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Shop - สั่งอาหารออนไลน์</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- LINE SDK -->
    <script src="https://d.line-scdn.net/liff/web/sdk/web-sdk.js"></script>
    
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --bg-color: #f8f9fa;
            --text-color: #333333;
            --light-gray: #f1f5f9;
            --card-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            --header-shadow: 0 10px 30px rgba(118, 75, 162, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 120px;
            line-height: 1.6;
        }

        /* Header Section */
        .header-cover {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            padding: 40px 20px 30px;
            border-radius: 0 0 35px 35px;
            color: white;
            box-shadow: var(--header-shadow);
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }

        .header-cover::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" preserveAspectRatio="none"><path d="M0,0 L1000,0 L1000,100 L0,100 Z" fill="rgba(255,255,255,0.05)"/></svg>');
            background-size: cover;
        }

        .shop-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .shop-subtitle {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 0;
        }

        /* Member Badge */
        .member-badge {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 10px 15px;
            display: inline-flex;
            align-items: center;
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            max-width: 300px;
            width: 100%;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid white;
            object-fit: cover;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .user-info {
            flex-grow: 1;
            min-width: 0;
        }

        .user-name {
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-points {
            font-size: 0.85rem;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .points-icon {
            margin-right: 4px;
        }

        /* Category Scroll */
        .category-scroll {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            padding: 15px 20px;
            margin: 0 -20px 20px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .category-scroll::-webkit-scrollbar {
            display: none;
        }

        .category-pill {
            cursor: pointer;
            border-radius: 50px;
            padding: 8px 22px;
            background: white;
            border: 1px solid #e2e8f0;
            margin-right: 10px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 500;
            flex-shrink: 0;
        }

        .category-pill:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .category-pill.active {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        /* Product Cards */
        .product-card {
            border: none;
            border-radius: 18px;
            overflow: hidden;
            background: white;
            box-shadow: var(--card-shadow);
            transition: all 0.3s;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        .product-img-container {
            position: relative;
            overflow: hidden;
            height: 160px;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-img {
            transform: scale(1.05);
        }

        .stock-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 500;
            z-index: 10;
        }

        .out-of-stock-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .product-card.out-of-stock {
            filter: grayscale(0.8);
            opacity: 0.7;
        }

        .product-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .product-name {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .product-description {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 10px;
            flex-grow: 1;
        }

        .product-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        /* Cart Bar */
        .cart-bar {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 16px 20px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            z-index: 100;
            transition: all 0.3s;
        }

        .cart-bar:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
        }

        .cart-items-count {
            background: white;
            color: var(--primary-color);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            margin-right: 10px;
        }

        .cart-text {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .cart-total {
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
        }

        /* Staff Button */
        .staff-btn-container {
            position: fixed;
            bottom: 100px;
            right: 20px;
            z-index: 95;
        }

        .staff-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .staff-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
        }

        /* Staff Dashboard */
        .staff-dashboard-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: none;
            overflow-y: auto;
        }

        .staff-dashboard-overlay.show {
            display: flex;
            flex-direction: column;
        }

        .dashboard-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 1001;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
        }

        /* Modal */
        .modal {
            border-radius: 20px;
            border: none;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }

        .modal-header {
            border-bottom: 1px solid #f1f5f9;
            padding: 20px 25px;
        }

        .modal-title {
            font-weight: 700;
            color: #2d3436;
        }

        .modal-body {
            padding: 25px;
        }

        /* Form Styles */
        .form-label {
            font-weight: 500;
            color: #475569;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            border-radius: 10px;
            font-weight: 600;
            padding: 10px 20px;
            transition: all 0.3s;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        /* Loading States */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty States */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        /* Cart Item */
        .cart-item {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .shop-title {
                font-size: 1.5rem;
            }
            
            .product-img-container {
                height: 140px;
            }
            
            .cart-bar {
                bottom: 20px;
                padding: 14px 20px;
            }
            
            .staff-btn-container {
                bottom: 90px;
                right: 15px;
            }
            
            .staff-btn {
                width: 55px;
                height: 55px;
            }
        }

        @media (max-width: 576px) {
            .header-cover {
                padding: 30px 15px 25px;
                border-radius: 0 0 25px 25px;
            }
            
            .category-scroll {
                padding: 12px 15px;
                margin: 0 -15px 15px;
            }
            
            .product-name {
                font-size: 0.9rem;
            }
            
            .product-price {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <div class="header-cover text-center animate__animated animate__fadeIn">
        <h1 class="shop-title mb-2">
            <i class="fas fa-store me-2"></i>Mini Shop
        </h1>
        <p class="shop-subtitle">อาหารอร่อย สดใหม่ ทุกวัน ตลอด 24 ชม.</p>
        
        <!-- User Profile -->
        <div id="profile-info" class="d-none animate__animated animate__fadeInUp">
            <div class="member-badge">
                <img id="user-img" src="" class="user-avatar" alt="Profile Picture">
                <div class="user-info">
                    <div id="user-name" class="user-name">กำลังโหลด...</div>
                    <div id="user-points-display" class="user-points text-warning">
                        <span class="points-icon">
                            <i class="fas fa-coins"></i>
                        </span>
                        <span id="points-text">กำลังโหลดคะแนน...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Categories -->
        <div class="category-scroll" id="category-container">
            <span class="category-pill active" onclick="filterProduct('all', event)">ทั้งหมด</span>
        </div>

        <!-- Products Grid -->
        <div class="row g-3" id="product-list">
            <div class="col-12">
                <div class="text-center py-5">
                    <div class="loading-spinner"></div>
                    <p class="mt-3 text-muted">กำลังโหลดเมนูอาหาร...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Staff Dashboard Button -->
    <div id="staff-entry" class="staff-btn-container d-none animate__animated animate__zoomIn">
        <button class="staff-btn" onclick="showStaffDashboard()">
            <i class="fas fa-chart-pie fa-lg"></i>
        </button>
    </div>

    <!-- Cart Bar -->
    <div class="cart-bar animate__animated animate__fadeInUp" id="cart-bar" onclick="openCartModal()">
        <div class="d-flex align-items-center">
            <div class="cart-items-count" id="total-qty">0</div>
            <span class="cart-text">ตะกร้าสินค้า</span>
        </div>
        <div class="cart-total">
            <span id="total-price">0</span> <small>฿</small>
            <i class="fas fa-chevron-right ms-2 opacity-75"></i>
        </div>
    </div>

    <!-- Staff Dashboard -->
    <div id="staff-dashboard" class="staff-dashboard-overlay">
        <div class="dashboard-header">
            <div class="container">
                <div class="d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold">
                        <i class="fas fa-chart-line me-2"></i>แดชบอร์ดผู้ดูแล
                    </h5>
                    <button class="btn btn-sm btn-light rounded-pill px-3" onclick="hideStaffDashboard()">
                        <i class="fas fa-times me-1"></i> ปิด
                    </button>
                </div>
            </div>
        </div>
        
        <div class="container mt-4 pb-5">
            <!-- Sales Stats -->
            <div class="stat-card">
                <h6 class="fw-bold mb-4 opacity-90">สรุปยอดขายวันนี้</h6>
                <div class="row text-center">
                    <div class="col-6 border-end border-white border-opacity-25">
                        <small class="d-block opacity-90 mb-1">ยอดขายรวม</small>
                        <span class="fw-bold fs-3" id="stat-today">0</span> ฿
                    </div>
                    <div class="col-6">
                        <small class="d-block opacity-90 mb-1">จำนวนออเดอร์</small>
                        <span class="fw-bold fs-3" id="stat-orders">0</span>
                    </div>
                </div>
                <div class="row mt-4 text-center">
                    <div class="col-6 border-end border-white border-opacity-25">
                        <small class="d-block opacity-90 mb-1">ยอดรับแล้ว</small>
                        <span class="fw-bold fs-4" id="stat-realized">0</span> ฿
                    </div>
                    <div class="col-6">
                        <small class="d-block opacity-90 mb-1">รอดำเนินการ</small>
                        <span class="fw-bold fs-4" id="stat-pending">0</span> ฿
                    </div>
                </div>
            </div>

            <!-- Top Products -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">
                    <h6 class="fw-bold mb-3 text-muted">
                        <i class="fas fa-crown me-2 text-warning"></i>เมนูขายดี Top 5
                    </h6>
                    <ul id="stat-top-menu" class="list-unstyled mb-0">
                        <li class="text-center text-muted py-3">
                            <div class="spinner-border spinner-border-sm text-primary me-2"></div>
                            กำลังโหลดข้อมูล...
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Recent Orders -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="fw-bold m-0 text-muted">
                    <i class="fas fa-clock-rotate-left me-2"></i>รายการล่าสุด
                </h6>
                <button class="btn btn-sm btn-outline-primary rounded-pill px-3" onclick="refreshDashboard()">
                    <i class="fas fa-redo me-1"></i>รีเฟรช
                </button>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <div id="admin-orders-list" class="list-group list-group-flush">
                        <div class="text-center text-muted py-3">
                            <div class="spinner-border spinner-border-sm me-2"></div>
                            กำลังโหลดออเดอร์...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Main JavaScript -->
    <script>
        // ==========================================
        // Global Variables
        // ==========================================
        let currentUser = null;
        let cart = [];
        let products = [];
        let allCategories = [];
        let userMemberData = null;

        // ⚙️ API Configuration - กรุณาเปลี่ยนเป็น URL ของคุณ
        const API_URL = "https://script.google.com/macros/s/AKfycbzBTjKc5Bk-gEhmyuE_swj4hiochGQIeaLHPT4rWkMKKCtUSVimu0JtTSXdZVzSIRmN/exec";
        const LIFF_ID = "2008933274-rcX7VWVR"; // ⚙️ เปลี่ยนเป็น LIFF ID ของคุณ

        // ==========================================
        // 1. Initialize App
        // ==========================================
        async function initApp() {
            try {
                console.log('🚀 Initializing app...');
                
                // Initialize LIFF
                await liff.init({ liffId: LIFF_ID });
                console.log('✅ LIFF initialized');
                
                // Check if logged in with LINE
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    currentUser = {
                        uid: profile.userId,
                        name: profile.displayName,
                        pictureUrl: profile.pictureUrl
                    };
                    console.log('✅ User logged in:', currentUser.name);
                    
                    // Load member profile
                    await loadMemberProfile();
                    
                    // Show user profile
                    showUserProfile();
                    
                    // Show staff button if admin
                    checkStaffStatus();
                } else {
                    console.log('⚠️ User not logged in (guest mode)');
                    showGuestMessage();
                }
                
                // Load products
                await loadProducts();
                
                // Load cart from storage
                loadCartFromStorage();
                
                console.log('✅ App initialized successfully');
            } catch (error) {
                console.error('❌ Init error:', error);
                showError('เกิดข้อผิดพลาดในการเริ่มต้น: ' + error.message);
            }
        }

        // ==========================================
        // 2. Load Products
        // ==========================================
        async function loadProducts() {
            try {
                console.log('📦 Loading products...');
                showLoading(true);
                
                const response = await fetch(`${API_URL}?action=getProducts`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (!Array.isArray(data)) {
                    throw new Error('Invalid data format - expected array');
                }
                
                products = data;
                console.log('✅ Loaded', products.length, 'products');
                
                // Extract categories
                allCategories = [...new Set(products.map(p => p.category || p.Category).filter(c => c))];
                
                // Render categories
                renderCategories(allCategories);
                
                // Render products
                renderProducts(products);
                
                showLoading(false);
            } catch (error) {
                console.error('❌ Load products error:', error);
                showError('ไม่สามารถโหลดเมนูอาหาร: ' + error.message);
                showLoading(false);
            }
        }

        // ==========================================
        // 3. Render Categories
        // ==========================================
        function renderCategories(categories) {
            const container = document.getElementById('category-container');
            container.innerHTML = '<span class="category-pill active" onclick="filterProduct(\'all\', event)">ทั้งหมด</span>';
            
            categories.forEach(cat => {
                const pill = document.createElement('span');
                pill.className = 'category-pill';
                pill.textContent = cat;
                pill.style.cursor = 'pointer';
                pill.onclick = (e) => filterProduct(cat, e);
                container.appendChild(pill);
            });
        }

        // ==========================================
        // 4. Filter Products
        // ==========================================
        function filterProduct(category, event) {
            // Update active pill
            document.querySelectorAll('.category-pill').forEach(pill => {
                pill.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Filter products
            if (category === 'all') {
                renderProducts(products);
            } else {
                const filtered = products.filter(p => (p.category || p.Category) === category);
                renderProducts(filtered);
            }
        }

        // ==========================================
        // 5. Render Products Grid
        // ==========================================
        function renderProducts(productsToShow) {
            const container = document.getElementById('product-list');
            
            if (productsToShow.length === 0) {
                container.innerHTML = `
                    <div class="col-12">
                        <div class="empty-state">
                            <i class="fas fa-box"></i>
                            <p>ไม่มีสินค้าในหมวดนี้</p>
                        </div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = productsToShow.map((product, idx) => {
                const productName = product.name || product.Menu || 'No name';
                const productPrice = product.price || product.Price || 0;
                const productImg = product.img || product.Image || 'https://via.placeholder.com/300x200?text=No+Image';
                const isOutOfStock = !(product.instock !== false || product.InStock !== false);
                
                return `
                    <div class="col-md-6 col-lg-4">
                        <div class="product-card ${isOutOfStock ? 'out-of-stock' : ''}">
                            <!-- Image -->
                            <div class="product-img-container">
                                <img src="${productImg}" 
                                     class="product-img" 
                                     alt="${productName}"
                                     onerror="this.src='https://via.placeholder.com/300x200?text=Error+Loading'">
                                
                                <!-- Stock badge -->
                                <span class="stock-badge">
                                    ${isOutOfStock ? '❌ หมด' : '✅ มี'}
                                </span>
                                
                                <!-- Out of stock overlay -->
                                ${isOutOfStock ? '<div class="out-of-stock-overlay"><span>สินค้าหมด</span></div>' : ''}
                            </div>
                            
                            <!-- Product Info -->
                            <div class="product-info">
                                <h5 class="product-name">${productName}</h5>
                                <p class="product-description">${product.description || product.Description || ''}</p>
                                <div class="d-flex justify-content-between align-items-end">
                                    <span class="product-price">฿${parseFloat(productPrice).toFixed(2)}</span>
                                    <button 
                                        class="btn btn-sm btn-primary"
                                        onclick="addToCart('${productName.replace(/'/g, "\\'")}', ${productPrice}, '${productImg}')"
                                        ${isOutOfStock ? 'disabled' : ''}
                                    >
                                        <i class="fas fa-plus"></i> เพิ่ม
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ==========================================
        // 6. Shopping Cart Functions
        // ==========================================
        function addToCart(name, price, image) {
            try {
                const existingItem = cart.find(item => item.name === name);
                
                if (existingItem) {
                    existingItem.quantity += 1;
                } else {
                    cart.push({
                        name: name,
                        price: parseFloat(price),
                        image: image,
                        quantity: 1
                    });
                }
                
                // Show success
                Swal.fire({
                    icon: 'success',
                    title: 'เพิ่มสินค้า',
                    text: `${name} ✅`,
                    timer: 1500,
                    position: 'top-end',
                    showConfirmButton: false
                });
                
                updateCartUI();
                saveCartToStorage();
            } catch (error) {
                console.error('Error adding to cart:', error);
                showError('ไม่สามารถเพิ่มสินค้า');
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
            saveCartToStorage();
        }

        function updateQuantity(index, quantity) {
            quantity = parseInt(quantity);
            if (quantity <= 0) {
                removeFromCart(index);
            } else {
                cart[index].quantity = quantity;
                updateCartUI();
                saveCartToStorage();
            }
        }

        function updateCartUI() {
            const totalQty = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            document.getElementById('total-qty').textContent = totalQty;
            document.getElementById('total-price').textContent = totalPrice.toFixed(2);
        }

        function saveCartToStorage() {
            localStorage.setItem('minishop_cart', JSON.stringify(cart));
        }

        function loadCartFromStorage() {
            try {
                const saved = localStorage.getItem('minishop_cart');
                if (saved) {
                    cart = JSON.parse(saved);
                    updateCartUI();
                }
            } catch (error) {
                console.error('Error loading cart:', error);
                cart = [];
            }
        }

        // ==========================================
        // 7. Cart Modal
        // ==========================================
        async function openCartModal() {
            if (cart.length === 0) {
                Swal.fire({
                    icon: 'warning',
                    title: 'ตะกร้าว่าง',
                    text: 'กรุณาเพิ่มสินค้าลงตะกร้า'
                });
                return;
            }
            
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const cartHTML = cart.map((item, idx) => `
                <div class="cart-item">
                    <div class="d-flex gap-2 mb-2">
                        <img src="${item.image}" style="width:60px; height:60px; border-radius:8px; object-fit:cover;" onerror="this.src='https://via.placeholder.com/60x60'">
                        <div class="flex-grow-1">
                            <h6 class="mb-1">${item.name}</h6>
                            <p class="text-muted mb-0">฿${item.price.toFixed(2)}</p>
                        </div>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <input type="number" class="form-control form-control-sm" style="width:60px;" 
                               value="${item.quantity}" 
                               onchange="updateQuantity(${idx}, this.value)">
                        <span class="fw-bold">฿${(item.price * item.quantity).toFixed(2)}</span>
                        <button class="btn btn-sm btn-danger" onclick="removeFromCart(${idx})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            
            const { isConfirmed } = await Swal.fire({
                title: '🛒 ตะกร้าสินค้า',
                html: `
                    <div style="max-height: 300px; overflow-y: auto; text-align: left;">
                        ${cartHTML}
                    </div>
                    <div style="margin-top: 20px; padding-top: 10px; border-top: 2px solid #ddd; text-align: left;">
                        <h5>รวมทั้งสิ้น: <span class="text-primary">฿${totalPrice.toFixed(2)}</span></h5>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'ดำเนินการต่อ',
                cancelButtonText: 'ปิด',
                confirmButtonColor: '#667eea',
                didOpen: (modal) => {
                    modal.querySelector('.swal2-html-container').style.textAlign = 'left';
                }
            });
            
            if (isConfirmed) {
                openCheckoutModal();
            }
        }

        // ==========================================
        // 8. Checkout Modal
        // ==========================================
        async function openCheckoutModal() {
            const { value: formValues, isConfirmed } = await Swal.fire({
                title: '📋 ข้อมูลการสั่งซื้อ',
                html: `
                    <div style="text-align: left;">
                        <div class="mb-3">
                            <label class="form-label">ชื่อผู้รับ <span class="text-danger">*</span></label>
                            <input type="text" id="checkout-name" class="form-control" 
                                   placeholder="ชื่อ" value="${currentUser?.name || ''}">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">เบอร์โทรศัพท์ <span class="text-danger">*</span></label>
                            <input type="tel" id="checkout-phone" class="form-control" 
                                   placeholder="0812345678" pattern="[0-9]{9,}">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">ที่อยู่สำหรับจัดส่ง <span class="text-danger">*</span></label>
                            <textarea id="checkout-address" class="form-control" 
                                      placeholder="ที่อยู่โดยละเอียด" rows="3"></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">หมายเหตุเพิ่มเติม</label>
                            <textarea id="checkout-note" class="form-control" 
                                      placeholder="เช่น ไม่ใส่พริก ไม่ใส่เหล้า" rows="2"></textarea>
                        </div>
                    </div>
                `,
                focusConfirm: false,
                confirmButtonText: 'ส่งคำสั่งซื้อ',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: '#10b981',
                preConfirm: () => {
                    const name = document.getElementById('checkout-name').value.trim();
                    const phone = document.getElementById('checkout-phone').value.trim();
                    const address = document.getElementById('checkout-address').value.trim();
                    const note = document.getElementById('checkout-note').value.trim();
                    
                    // Validation
                    if (!name) {
                        Swal.showValidationMessage('❌ กรุณากรอกชื่อผู้รับ');
                        return false;
                    }
                    
                    if (!phone || !/^\d{9,}$/.test(phone)) {
                        Swal.showValidationMessage('❌ กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง (อย่างน้อย 9 หลัก)');
                        return false;
                    }
                    
                    if (!address) {
                        Swal.showValidationMessage('❌ กรุณากรอกที่อยู่สำหรับจัดส่ง');
                        return false;
                    }
                    
                    return { name, phone, address, note };
                },
                didOpen: (modal) => {
                    modal.querySelector('.swal2-html-container').style.textAlign = 'left';
                }
            });
            
            if (isConfirmed && formValues) {
                await submitOrder(formValues);
            }
        }

        // ==========================================
        // 9. Submit Order
        // ==========================================
        async function submitOrder(formData) {
            try {
                showLoading(true);
                
                const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                
                const payload = {
                    action: 'submitOrder',
                    uid: currentUser?.uid || 'guest',
                    name: formData.name,
                    phone: formData.phone,
                    address: formData.address,
                    note: formData.note,
                    items: cart.map(i => `${i.name} x${i.quantity}`).join(', '),
                    total: totalAmount,
                    image: null,
                    mimeType: 'image/jpeg'
                };
                
                console.log('📤 Submitting order...', payload);
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                
                console.log('Response:', result);
                
                if (result.result === 'Success') {
                    showLoading(false);
                    
                    cart = [];
                    updateCartUI();
                    saveCartToStorage();
                    
                    Swal.fire({
                        icon: 'success',
                        title: '✅ สั่งซื้อสำเร็จ!',
                        html: `
                            <p>หมายเลขอเดอร์: <strong class="text-primary">${result.orderId}</strong></p>
                            <p>กรุณาชำระเงินตามจำนวนที่ระบุ</p>
                            <p class="text-muted">ทั้งหมด: <strong>฿${totalAmount.toFixed(2)}</strong></p>
                            <p class="text-success mt-2">ทั้งหมด: เราจะส่ง LINE notification ให้คุณเมื่อเตรียมส่ง</p>
                        `,
                        confirmButtonColor: '#667eea'
                    });
                } else {
                    throw new Error(result.message || 'ไม่ทราบข้อผิดพลาด');
                }
                
            } catch (error) {
                console.error('❌ Submit order error:', error);
                showError('ไม่สามารถส่งคำสั่งซื้อ: ' + error.message);
            } finally {
                showLoading(false);
            }
        }

        // ==========================================
        // 10. User Profile
        // ==========================================
        async function loadMemberProfile() {
            try {
                const response = await fetch(
                    `${API_URL}?action=getMember&uid=${currentUser.uid}&name=${encodeURIComponent(currentUser.name)}`
                );
                const data = await response.json();
                
                if (data.status === 'found' || data.status === 'new') {
                    userMemberData = {
                        points: data.points || 0,
                        rank: data.rank || 'New 🆕',
                        totalSpent: data.totalSpent || 0
                    };
                    console.log('✅ Member data loaded:', userMemberData);
                }
            } catch (error) {
                console.error('Error loading member profile:', error);
            }
        }

        function showUserProfile() {
            const profileDiv = document.getElementById('profile-info');
            
            if (!profileDiv || !currentUser) return;
            
            profileDiv.classList.remove('d-none');
            document.getElementById('user-img').src = currentUser.pictureUrl;
            document.getElementById('user-name').textContent = currentUser.name;
            document.getElementById('points-text').textContent = 
                `${userMemberData?.points || 0} Points - ${userMemberData?.rank || 'New 🆕'}`;
        }

        function showGuestMessage() {
            Swal.fire({
                icon: 'info',
                title: 'ยินดีต้อนรับ',
                text: 'โปรดเข้าสู่ระบบด้วย LINE เพื่อติดตามสถานะออเดอร์และได้รับ Points',
                confirmButtonColor: '#667eea'
            });
        }

        // ==========================================
        // 11. Staff Dashboard
        // ==========================================
        async function checkStaffStatus() {
            try {
                const response = await fetch(
                    `${API_URL}?action=checkStaff&uid=${currentUser.uid}`
                );
                const data = await response.json();
                
                if (data.isStaff) {
                    document.getElementById('staff-entry').classList.remove('d-none');
                }
            } catch (error) {
                console.error('Error checking staff status:', error);
            }
        }

        function showStaffDashboard() {
            if (!currentUser) {
                showError('กรุณาเข้าสู่ระบบจากนั้นลองอีกครั้ง');
                return;
            }
            
            const dashboard = document.getElementById('staff-dashboard');
            dashboard.classList.add('show');
            refreshDashboard();
        }

        function hideStaffDashboard() {
            const dashboard = document.getElementById('staff-dashboard');
            dashboard.classList.remove('show');
        }

        async function refreshDashboard() {
            try {
                showLoading(true);
                
                // Get stats
                const statsResponse = await fetch(
                    `${API_URL}?action=getOwnerStats&uid=${currentUser?.uid}`
                );
                const stats = await statsResponse.json();
                
                document.getElementById('stat-today').textContent = stats.todayTotal?.toFixed(2) || '0';
                document.getElementById('stat-orders').textContent = stats.orderCount || '0';
                document.getElementById('stat-realized').textContent = stats.realizedTotal?.toFixed(2) || '0';
                document.getElementById('stat-pending').textContent = stats.pendingTotal?.toFixed(2) || '0';
                
                // Get top menu
                if (stats.topMenu) {
                    const topMenuHTML = stats.topMenu.slice(0, 5).map(item => `
                        <li class="d-flex justify-content-between py-2 border-bottom">
                            <span>${item.name}</span>
                            <span class="fw-bold">${item.count} ชิ้น</span>
                        </li>
                    `).join('');
                    document.getElementById('stat-top-menu').innerHTML = topMenuHTML || '<li class="py-2 text-muted">ไม่มีข้อมูล</li>';
                }
                
                // Get orders
                const ordersResponse = await fetch(
                    `${API_URL}?action=getAdminOrders&uid=${currentUser?.uid}`
                );
                const orders = await ordersResponse.json();
                
                if (Array.isArray(orders) && orders.length > 0) {
                    const ordersHTML = orders.slice(0, 10).map(order => `
                        <div class="list-group-item">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h6 class="mb-1">${order.orderId || 'N/A'}</h6>
                                    <p class="mb-1 text-muted"><small>${order.name || 'Unknown'}</small></p>
                                    <p class="mb-0 text-muted"><small>${order.timestamp || ''}</small></p>
                                </div>
                                <div class="text-end">
                                    <p class="mb-1 fw-bold">฿${order.total?.toFixed(2) || '0'}</p>
                                    <select class="form-select form-select-sm" style="width:120px;" 
                                            onchange="updateOrderStatus('${order.orderId}', this.value)">
                                        <option value="${order.status}" selected>${order.status}</option>
                                        <option value="รอดำเนินการ">รอดำเนินการ</option>
                                        <option value="กำลังทำอาหาร">กำลังทำอาหาร</option>
                                        <option value="กำลังจัดส่ง">กำลังจัดส่ง</option>
                                        <option value="เสร็จสิ้น">เสร็จสิ้น</option>
                                        <option value="ยกเลิก">ยกเลิก</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    `).join('');
                    document.getElementById('admin-orders-list').innerHTML = ordersHTML;
                } else {
                    document.getElementById('admin-orders-list').innerHTML = '<div class="list-group-item text-center text-muted">ไม่มีออเดอร์</div>';
                }
                
                showLoading(false);
            } catch (error) {
                console.error('Error refreshing dashboard:', error);
                showError('ไม่สามารถโหลดแดชบอร์ด');
                showLoading(false);
            }
        }

        async function updateOrderStatus(orderId, newStatus) {
            try {
                showLoading(true);
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        action: 'updateStatus',
                        uid: currentUser?.uid,
                        orderId: orderId,
                        newStatus: newStatus
                    })
                });
                
                const result = await response.json();
                
                if (result.result === 'Success') {
                    Swal.fire({
                        icon: 'success',
                        title: 'อัปเดตสถานะสำเร็จ',
                        timer: 1500,
                        showConfirmButton: false
                    });
                    refreshDashboard();
                } else {
                    throw new Error(result.message);
                }
                
            } catch (error) {
                console.error('Error updating status:', error);
                showError('ไม่สามารถอัปเดตสถานะ');
            } finally {
                showLoading(false);
            }
        }

        // ==========================================
        // 12. UI Helpers
        // ==========================================
        function showLoading(show) {
            // Can be improved with a global loading overlay
            console.log(show ? '⏳ Loading...' : '✅ Done loading');
        }

        function showError(message) {
            Swal.fire({
                icon: 'error',
                title: 'เกิดข้อผิดพลาด',
                text: message,
                confirmButtonColor: '#ef4444'
            });
        }

        // ==========================================
        // 13. Initialize on Load
        // ==========================================
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
